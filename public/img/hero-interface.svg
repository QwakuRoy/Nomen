  <rect x="868" y="500" width="226" height="44" rx="12" fill="#221E55" stroke="#7C5CFF" stroke-opacity="0.8"/>
  <text x="884" y="527" font-size="13" fill="#B9B2FF" fill-opacity="0.7" text-decoration="line-through">Frame 128</text>
  <text x="960" y="527" font-size="13" fill="#7C5CFF">→</text>
  <text x="978" y="527" font-size="13" font-weight="600" fill="#F5F5F7">Product Card</text>

