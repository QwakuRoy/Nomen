      <stop offset="1" stop-color="#3DDC97" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Window -->
  <rect x="1" y="1" width="1598" height="898" rx="24" fill="#191641" stroke="#B9B2FF" stroke-opacity="0.35" stroke-width="2"/>

