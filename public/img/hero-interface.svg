  <circle cx="1430" cy="31" r="12" fill="#7C5CFF"/>
  <circle cx="1452" cy="31" r="12" fill="#3DDC97" stroke="#221E55" stroke-width="3"/>
  <rect x="1480" y="18" width="96" height="26" rx="8" fill="#6D4AFF"/>
  <text x="1528" y="36" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Share</text>

