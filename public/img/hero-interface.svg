  <rect x="1128" y="352" width="164" height="8" rx="4" fill="#1E1B4B" fill-opacity="0.18"/>
  <rect x="1128" y="372" width="120" height="8" rx="4" fill="#1E1B4B" fill-opacity="0.12"/>
  <rect x="1128" y="400" width="164" height="2" fill="#1E1B4B" fill-opacity="0.2"/>
  <rect x="1128" y="418" width="164" height="54" rx="10" fill="#1E1B4B" fill-opacity="0.08"/>
  <rect x="1128" y="520" width="164" height="32" rx="10" fill="#6D4AFF"/>

