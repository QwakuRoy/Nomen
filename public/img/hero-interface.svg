    <text x="64" y="202" fill-opacity="0.75">T  Page Title</text>
    <text x="64" y="236" fill-opacity="0.75">◇ Back Button</text>
    <!-- mid-rename row -->
    <rect x="12" y="250" width="236" height="62" rx="8" fill="#7C5CFF" fill-opacity="0.22" stroke="#7C5CFF" stroke-opacity="0.6"/>
    <text x="44" y="274" fill-opacity="0.6" text-decoration="line-through"># Frame 128</text>
    <text x="44" y="298" fill="#F5F5F7" font-weight="600"># Product Card</text>
    <text x="64" y="336" fill-opacity="0.75">□ Product Image</text>
    <text x="64" y="370" fill-opacity="0.75">T  Product Name</text>
    <text x="64" y="404" fill-opacity="0.75">T  Price</text>
