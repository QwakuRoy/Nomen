    <rect x="1362" y="618" width="212" height="44" rx="8" fill="#7C5CFF" fill-opacity="0.18" stroke="#7C5CFF" stroke-opacity="0.6"/>
    <rect x="1372" y="628" width="24" height="24" rx="6" fill="#1E1B4B"/>
    <text x="1406" y="645" fill="#F5F5F7" font-weight="600">Nomen · 15 renamed</text>
