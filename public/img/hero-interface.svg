  <rect x="332" y="160" width="120" height="12" rx="6" fill="#1E1B4B" fill-opacity="0.25"/>
  <rect x="332" y="192" width="206" height="150" rx="14" fill="url(#img)"/>
  <rect x="332" y="360" width="170" height="10" rx="5" fill="#1E1B4B" fill-opacity="0.22"/>
  <rect x="332" y="380" width="100" height="10" rx="5" fill="#1E1B4B" fill-opacity="0.16"/>
  <rect x="332" y="410" width="206" height="40" rx="10" fill="#fff" stroke="#1E1B4B" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="332" y="466" width="98" height="70" rx="12" fill="#1E1B4B" fill-opacity="0.1"/>
  <rect x="440" y="466" width="98" height="70" rx="12" fill="#1E1B4B" fill-opacity="0.1"/>
  <rect x="332" y="572" width="206" height="38" rx="10" fill="#6D4AFF"/>

