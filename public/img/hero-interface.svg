<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, sans-serif">
  <!-- Original illustration of a design tool mid-rename, drawn in Nomen's palette for the hero background. -->
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
