    <rect x="1474" y="148" width="100" height="30" rx="6" fill="#2A2663"/><text x="1486" y="168">H  170</text>
    <text x="1362" y="218">Auto layout</text>
    <rect x="1362" y="230" width="212" height="30" rx="6" fill="#2A2663"/>
    <rect x="1366" y="234" width="68" height="22" rx="4" fill="#7C5CFF" fill-opacity="0.6"/>
    <text x="1362" y="300">Corner radius</text>
    <rect x="1362" y="312" width="212" height="4" rx="2" fill="#2A2663"/>
    <rect x="1362" y="312" width="90" height="4" rx="2" fill="#7C5CFF"/>
    <circle cx="1452" cy="314" r="7" fill="#F5F5F7"/>
    <text x="1362" y="360">Fill</text>
    <rect x="1362" y="372" width="212" height="30" rx="6" fill="#2A2663"/>
    <rect x="1370" y="379" width="16" height="16" rx="4" fill="#F5F5F7"/><text x="1396" y="392">F5F5F7</text>
    <text x="1362" y="442">Stroke</text>
    <rect x="1362" y="454" width="212" height="30" rx="6" fill="#2A2663"/>
    <rect x="1370" y="461" width="16" height="16" rx="4" fill="#7C5CFF"/><text x="1396" y="474">7C5CFF</text>
    <text x="1362" y="524">Effects</text>
    <rect x="1362" y="536" width="212" height="30" rx="6" fill="#2A2663"/>
