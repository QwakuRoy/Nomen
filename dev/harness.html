<!doctype html>
<!-- Dev-only: renders dist/ui.html in a plugin-sized iframe and fakes the Figma main thread. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plugin UI Harness</title>
    <style>
      body { font: 12px system-ui, sans-serif; background: #e5e5e5; margin: 0; padding: 16px; display: flex; gap: 16px; }
      iframe { width: 380px; height: 600px; border: 0; border-radius: 8px; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.15); }
      .panel { display: flex; flex-direction: column; gap: 6px; }
      button { padding: 6px 10px; }
      pre { max-width: 420px; white-space: pre-wrap; font-size: 11px; background: #fff; padding: 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <iframe id="ui" src="../dist/ui.html"></iframe>
    <div class="panel">
      <strong>Selection scenario</strong>
      <button data-sel="checkout">Checkout Page</button>
      <button data-sel="multi">Multiple frames</button>
      <button data-sel="none">Nothing selected</button>
      <button data-sel="leaf">Single rectangle</button>
      <button data-sel="clean">Already clean</button>
      <label><input type="checkbox" id="fail-scan" /> Fail next scan</label>
      <strong>Log (UI → main)</strong>
      <pre id="log"></pre>
    </div>
    <script type="module">
      const frame = document.getElementById("ui");
      const log = document.getElementById("log");
      let settings = { apiKey: null, includeContentNamedText: false };
      let scenario = "checkout";

      const L = (id, type, name, extra = {}, children = []) => ({ id, type, name, extra, children });
      const checkout = L("1:1", "FRAME", "Checkout Page", { width: 390, height: 844 }, [
        L("1:2", "FRAME", "Frame 12", { width: 390, height: 64, layoutMode: "HORIZONTAL" }, [
          L("1:3", "TEXT", "Text 14", { text: "Checkout" }),
          L("1:4", "FRAME", "Frame 15", { width: 24, height: 24 }, [L("1:5", "VECTOR", "Vector 17", { width: 16, height: 16 })]),
          L("1:6", "RECTANGLE", "Rectangle 18", { width: 390, height: 1, hasFill: true }),
        ]),
        L("1:7", "FRAME", "Product Card", { width: 358, height: 120, layoutMode: "HORIZONTAL" }, [
          L("1:8", "RECTANGLE", "Rectangle 21", { width: 96, height: 96, hasFill: true, hasImageFill: true, cornerRadius: 8 }),
          L("1:9", "TEXT", "Text 22", { text: "Nike Air Max 90" }),
          L("1:10", "TEXT", "Text 23", { text: "£120.00" }),
        ]),
        L("1:11", "FRAME", "Frame 30", { width: 358, height: 48, hasStroke: true, cornerRadius: 8, layoutMode: "HORIZONTAL" }, [
          L("1:12", "TEXT", "Text 31", { text: "Search products" }),
        ]),
        L("1:13", "ELLIPSE", "Ellipse 3", { width: 8, height: 8, hasFill: true }),
        L("1:14", "INSTANCE", "Frame 44", { componentName: "Button / Primary / Default", width: 358, height: 52 }),
        L("1:15", "FRAME", "Frame 50", { width: 358, height: 52, hasFill: true, cornerRadius: 12, layoutMode: "HORIZONTAL" }, [
          L("1:16", "TEXT", "Place order", { text: "Place order" }),
        ]),
        L("1:17", "GROUP", "Group 52", { width: 200, height: 60 }, [
          L("1:18", "TEXT", "Text 60", { text: "By placing your order you agree to our terms of service and privacy policy." }),
        ]),
      ]);

      const status = (name, type, text) => {
        if (/^(Frame|Group|Rectangle|Ellipse|Vector|Text|Line)(\s+\d+)?$/i.test(name)) return "generic";
        if (type === "TEXT" && text && name.toLowerCase() === text.toLowerCase()) return "content";
        return "intentional";
      };
      function flatten(node, depth = 0, parentId, out = []) {
        const e = node.extra;
        out.push({
          id: node.id, type: node.type, name: node.name, nameStatus: status(node.name, node.type, e.text), depth, parentId,
          childIds: node.children.map((c) => c.id), text: e.text, componentName: e.componentName,
          width: e.width ?? 120, height: e.height ?? 20, layoutMode: e.layoutMode, hasFill: !!e.hasFill,
          hasImageFill: !!e.hasImageFill, hasStroke: !!e.hasStroke, cornerRadius: e.cornerRadius, visible: true,
        });
        node.children.forEach((c) => flatten(c, depth + 1, node.id, out));
        return out;
      }
      const clone = (tree, prefix, name) => {
        const walk = (n) => ({ ...n, id: prefix + n.id, children: n.children.map(walk) });
        return { ...walk(tree), name };
      };
      const roots = () =>
        scenario === "multi"
          ? [checkout, clone(checkout, "2", "Order Summary")]
          : scenario === "clean"
            ? [L("3:1", "FRAME", "Settings", {}, [L("3:2", "TEXT", "Title", { text: "Settings" }), L("3:3", "FRAME", "Toggle Row")])]
            : [checkout];

      const post = (msg) => frame.contentWindow.postMessage({ pluginMessage: msg }, "*");
      function sendSelection() {
        if (scenario === "none") return post({ type: "selection", roots: [], layerCount: 0, genericCount: 0, problem: "Select a frame, group, section, or component to analyze." });
        if (scenario === "leaf") return post({ type: "selection", roots: [], layerCount: 0, genericCount: 0, problem: '"Rectangle 4" is a single rectangle layer with nothing inside it. Select the frame, group, or section that contains it.' });
        const layers = roots().flatMap((r) => flatten(r));
        post({
          type: "selection",
          roots: roots().map((r) => ({ id: r.id, name: r.name, type: r.type })),
          layerCount: layers.length,
          genericCount: layers.filter((l) => l.nameStatus === "generic" && l.depth > 0).length,
        });
      }

      window.addEventListener("message", (e) => {
        const msg = e.data?.pluginMessage;
        if (!msg) return;
        log.textContent = JSON.stringify(msg, null, 1).slice(0, 1500) + "\n---\n" + log.textContent.slice(0, 3000);
        switch (msg.type) {
          case "ui-ready": post({ type: "settings", settings }); sendSelection(); break;
          case "scan":
            setTimeout(() => {
              if (document.getElementById("fail-scan").checked) return post({ type: "scan-error", message: "Simulated failure" });
              post({ type: "scan-result", roots: roots().map((r) => ({ rootId: r.id, rootName: r.name, rootType: r.type, layers: flatten(r), truncated: false })) });
            }, 400);
            break;
          case "apply":
            setTimeout(() => post({ type: "apply-result", renamed: msg.changes.length - 1, skipped: [{ nodeId: msg.changes[0].nodeId, name: msg.changes[0].expectedCurrentName, reason: "deleted" }] }), 200);
            break;
          case "save-settings": settings = { ...settings, ...msg.settings }; post({ type: "settings", settings }); break;
        }
      });
      document.querySelectorAll("[data-sel]").forEach((b) => b.addEventListener("click", () => { scenario = b.dataset.sel; sendSelection(); }));
    </script>
  </body>
</html>
