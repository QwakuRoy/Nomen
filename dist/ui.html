<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nomen</title>
    <style>
      /* Figma injects --figma-color-* variables when themeColors is on; the fallbacks keep the UI
   usable when previewed in a plain browser. */
:root {
  --bg: var(--figma-color-bg, #ffffff);
  --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
  --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
  --bg-selected: var(--figma-color-bg-selected, #e5f4ff);
  --text: var(--figma-color-text, #1e1e1e);
  --text-2: var(--figma-color-text-secondary, #6b6b6b);
  --text-3: var(--figma-color-text-tertiary, #9a9a9a);
  --border: var(--figma-color-border, #e6e6e6);
  --border-strong: var(--figma-color-border-strong, #d0d0d0);
  /* Nomen brand, "Ink and electric". The button violet is a shade deeper than the logo's
     #7C5CFF so white label text stays readable (WCAG AA). */
  --ink: #1E1B4B;
  --electric: #7C5CFF;
  --mint: #3DDC97;
  --brand: #6D4AFF;
  --brand-hover: #5B38F0;
  --on-brand: #ffffff;
  --brand-text: #5B38F0;
  --brand-tint: #EEEAFF;
  --danger: var(--figma-color-text-danger, #dc3412);
  --danger-bg: var(--figma-color-bg-danger-tertiary, #fff1ee);
  --warning: var(--figma-color-text-warning, #b86200);
  --warning-bg: var(--figma-color-bg-warning-tertiary, #fff4e0);
  --success: var(--figma-color-text-success, #14ae5c);
  --success-bg: var(--figma-color-bg-success-tertiary, #e6f7ee);
  --icon: var(--figma-color-icon, #1e1e1e);
  --icon-2: var(--figma-color-icon-secondary, #8a8a8a);
  --radius: 6px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 11px/16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
#app { display: flex; flex-direction: column; height: 100%; }
button, input { font: inherit; color: inherit; }

/* ---------- Header ---------- */
.header {
  display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header h1 { font-size: 11px; font-weight: 600; margin: 0; flex: 1; display: flex; align-items: center; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 0 6px; height: 18px; border-radius: 9px;
  background: var(--bg-2); color: var(--text-2); font-size: 10px; font-weight: 500;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.pill.ai .dot { background: var(--mint); }

.icon-btn {
  width: 28px; height: 28px; border: 0; border-radius: 5px; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--icon);
}
.icon-btn:hover { background: var(--bg-hover); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- Body ---------- */
.body { flex: 1; overflow-y: auto; padding: 12px; }
.body.flush { padding: 0; }
.section-label { color: var(--text-2); font-weight: 500; margin: 0 0 6px; }
.muted { color: var(--text-2); }
.small { font-size: 10px; line-height: 14px; }
p { margin: 0 0 8px; }

.card { border: 1px solid var(--border); border-radius: var(--radius); }
.root-list { list-style: none; margin: 0 0 12px; padding: 0; max-height: 132px; overflow-y: auto; }
.root-list li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.root-list li + li { border-top: 1px solid var(--border); }
.root-list .name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat { background: var(--bg-2); border-radius: var(--radius); padding: 8px 10px; }
.stat .num { font-size: 18px; line-height: 24px; font-weight: 600; }

.check { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; cursor: pointer; }
.check input { margin: 2px 0 0; }

.notice {
  display: flex; gap: 8px; padding: 8px 10px; border-radius: var(--radius);
  background: var(--bg-2); color: var(--text-2); margin-top: 8px;
}
.notice.warn { background: var(--warning-bg); color: var(--warning); }
.notice.error { background: var(--danger-bg); color: var(--danger); }
.notice svg { flex-shrink: 0; width: 16px; height: 16px; }
.link { background: none; border: 0; padding: 0; color: var(--brand-text); cursor: pointer; font-weight: 500; }

/* ---------- Empty / status screens ---------- */
.center {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 8px; padding: 24px;
}
.center .glyph {
  width: 48px; height: 48px; border-radius: 12px; background: var(--bg-2);
  display: flex; align-items: center; justify-content: center; color: var(--icon-2); margin-bottom: 4px;
}
.center .glyph.ok { background: var(--success-bg); color: var(--success); }
.center .glyph.bad { background: var(--danger-bg); color: var(--danger); }
.center .glyph svg { width: 24px; height: 24px; }
.center h2 { font-size: 13px; line-height: 20px; margin: 0; font-weight: 600; }
.center p { max-width: 280px; color: var(--text-2); }

/* ---------- Steps (loading) ---------- */
.steps { list-style: none; margin: 16px 0 0; padding: 0; }
.step { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: var(--text-3); }
.step .mark {
  width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0;
}
.step.done { color: var(--text); }
.step.done .mark { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.step.active { color: var(--text); font-weight: 500; }
.step.active .mark { border-color: var(--brand); border-top-color: transparent; animation: spin 0.8s linear infinite; }
.step.skipped .mark { border-style: dashed; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Preview ---------- */
.toolbar {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  border-bottom: 1px solid var(--border); padding: 8px 12px 0;
}
.summary { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.summary strong { font-size: 13px; line-height: 20px; }
.tabs { display: flex; gap: 2px; margin: 0 -4px; }
.tab {
  border: 0; background: none; padding: 6px 8px 8px; cursor: pointer; color: var(--text-2);
  border-bottom: 2px solid transparent; font-weight: 500;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--brand); }
.tab .count { color: var(--text-3); margin-left: 2px; }

.group-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-2);
  font-weight: 600;
}
.group-head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-head .muted { font-weight: 400; }

.row {
  display: grid; grid-template-columns: 16px 16px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  padding: 6px 12px; border-bottom: 1px solid var(--border);
}
.row:hover { background: var(--bg-hover); }
.row input[type="checkbox"] { margin: 0; }
.row .type { color: var(--icon-2); display: flex; }
.row .type svg { width: 14px; height: 14px; }
.row .names { min-width: 0; }
.row .old {
  color: var(--text-3); font-size: 10px; line-height: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .old .arrow { margin: 0 2px; }
.row input.new {
  width: 100%; height: 24px; padding: 0 6px; margin-left: -6px; width: calc(100% + 6px);
  border: 1px solid transparent; border-radius: 4px; background: transparent; font-weight: 500;
}
.row input.new:hover { border-color: var(--border); }
.row input.new:focus { outline: none; border-color: var(--brand); background: var(--bg); }
.row input.new::placeholder { color: var(--warning); font-weight: 400; font-style: italic; }
.row input.new.invalid { border-color: var(--danger); }
.row.off input.new { color: var(--text-2); }
.row .meta { display: flex; align-items: center; gap: 2px; }
.row .locate { opacity: 0; width: 24px; height: 24px; }
.row:hover .locate, .row .locate:focus-visible { opacity: 1; }

.badge {
  display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 4px;
  font-size: 9px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap;
}
.badge.review { background: var(--warning-bg); color: var(--warning); }
.badge.edited { background: var(--brand-tint); color: var(--brand-text); }
.conf { width: 6px; height: 6px; border-radius: 50%; margin: 0 4px; }
.conf.high { background: var(--mint); }
.conf.medium { background: var(--warning); opacity: 0.6; }

.empty-filter { padding: 32px 12px; text-align: center; color: var(--text-2); }

/* ---------- Footer ---------- */
.footer {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg);
}
.footer .grow { flex: 1; color: var(--text-2); }
.btn {
  height: 32px; padding: 0 12px; border-radius: 5px; border: 1px solid var(--border-strong);
  background: var(--bg); cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary:disabled:hover { background: var(--brand); }

/* ---------- Settings ---------- */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-weight: 500; }
.field input[type="password"], .field input[type="text"] {
  height: 32px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--bg);
}
.field input:focus { outline: none; border-color: var(--brand); }
.inline-actions { display: flex; gap: 8px; }
.skipped-list { list-style: none; padding: 0; margin: 8px 0 0; text-align: left; width: 100%; }
.skipped-list li { padding: 4px 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
.type { display: flex; color: var(--icon-2); flex-shrink: 0; }
.type svg { width: 14px; height: 14px; }
.row.select-all { background: var(--bg); font-weight: 500; color: var(--text-2); cursor: pointer; }
.row.select-all:hover { background: var(--bg-hover); }
.header h1 .subtitle { font-weight: 400; color: var(--text-3); margin-left: 6px; }

/* ---------- Brand ---------- */
input[type="checkbox"] { accent-color: var(--brand); }
.logo { width: 18px; height: 18px; flex-shrink: 0; display: block; }
/* Figma adds .figma-dark to <html> in dark mode: lift brand text and tints so they stay readable. */
.figma-dark {
  --brand-text: #A897FF;
  --brand-tint: #2E2766;
}

/* ---------- Results (after renaming) ---------- */
.done-toolbar { padding: 10px 12px; }
.done-banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--success-bg); }
.done-banner strong { font-size: 12px; line-height: 16px; }
.done-banner .done-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--success); flex-shrink: 0; }
.done-banner .done-icon svg { width: 16px; height: 16px; }
.done-banner.none { background: var(--bg-2); }
.done-banner.none .done-icon { color: var(--text-2); }
.row.done .tick { display: flex; color: var(--success); }
.row.done .old s { color: var(--text-3); }
.row.done .new-name { font-weight: 600; height: 24px; line-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Celebration (between Rename and the results list) ---------- */
.celebrate { cursor: pointer; }
.glyph.burst { position: relative; width: 64px; height: 64px; border-radius: 18px; animation: pop 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
.glyph.burst svg { width: 30px; height: 30px; }
.glyph.burst svg path { stroke-width: 1.8; stroke-dasharray: 16; stroke-dashoffset: 16; animation: draw 0.4s 0.25s ease-out forwards; }
.glyph.burst::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--success); animation: ring 0.9s 0.2s ease-out both; }
.rise { animation: rise 0.45s 0.3s ease-out both; }
@keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ring { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.7); opacity: 0; } }
@keyframes rise { 0% { transform: translateY(6px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .glyph.burst, .glyph.burst::after, .glyph.burst svg path, .rise { animation: none; stroke-dashoffset: 0; }
}
